<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Koleksi Game PlayStation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          PLAYSTATION GAME LIBRARY
        </h1>
        <p class="text-xs text-slate-400">Daftar lengkap koleksi game tersedia • Total: <span id="gameCounter" class="text-white font-semibold">0</span> Game</p>
      </div>

      <!-- Search Bar -->
      <div class="w-full md:w-80">
        <input type="text" id="searchInput" placeholder="Cari judul game atau genre..."
          class="w-full bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
      </div>
    </div>

    <!-- Filter Platform -->
    <div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto">
      <button onclick="setFilter('ALL')" class="filter-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white">Semua</button>
      <button onclick="setFilter('PS5')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">PS5</button>
      <button onclick="setFilter('PS4')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">PS4</button>
      <button onclick="setFilter('PS3')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">PS3</button>
      <button onclick="setFilter('PS2')" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">PS2</button>
    </div>
  </header>

  <!-- Grid Katalog -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">
      <div class="col-span-full text-center py-20 text-slate-500">Sedang memuat katalog game...</div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby0Zg_fWuHMLJ-wPvpr-JiVuohn8moT6blKVr32uzGRrngAk0IGZpp8WUllovHrfCc9/exec";
    let allGames = [];
    let currentPlatform = 'ALL';

    const badgeColors = {
      'PS5': 'bg-white text-slate-900',
      'PS4': 'bg-blue-600 text-white',
      'PS3': 'bg-slate-700 text-white',
      'PS2': 'bg-indigo-700 text-white'
    };

    async function fetchCatalog() {
      try {
        const res = await fetch(API_URL);
        allGames = await res.json();
        allGames.reverse(); // Game terbaru di paling atas
        renderGames();
      } catch (e) {
        document.getElementById('catalogGrid').innerHTML =
          '<div class="col-span-full text-center py-20 text-red-400">Gagal memuat katalog. Periksa koneksi atau URL API.</div>';
      }
    }

    function setFilter(platform) {
      currentPlatform = platform;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });
      event.target.classList.remove('bg-slate-800', 'text-slate-300');
      event.target.classList.add('bg-blue-600', 'text-white');
      renderGames();
    }

    function renderGames() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allGames.filter(g => {
        const matchPlatform = currentPlatform === 'ALL' || g.platform === currentPlatform;
        const matchSearch = g.nama.toLowerCase().includes(keyword) || g.genre.toLowerCase().includes(keyword);
        return matchPlatform && matchSearch;
      });

      document.getElementById('gameCounter').innerText = filtered.length;
      const grid = document.getElementById('catalogGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500">Game tidak ditemukan.</div>';
        return;
      }

      grid.innerHTML = filtered.map(g => `
        <div class="group bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-blue-500/60 transition duration-300 flex flex-col shadow-lg">
          <div class="relative aspect-[3/4] overflow-hidden bg-slate-800">
            <img src="${g.cover}" alt="${g.nama}" loading="lazy"
              onerror="this.src='https://placehold.co/300x400/1e293b/94a3b8?text=No+Cover'"
              class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            <span class="absolute top-2.5 left-2.5 px-2.5 py-0.5 rounded text-[11px] font-bold shadow ${badgeColors[g.platform] || 'bg-blue-600'}">
              ${g.platform}
            </span>
            <span class="absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded bg-black/75 backdrop-blur-sm text-[11px] text-slate-200 font-medium">
              ${g.ukuran}
            </span>
          </div>
          <div class="p-3.5 flex-1 flex flex-col justify-between">
            <h3 class="font-bold text-sm text-slate-100 line-clamp-2 group-hover:text-blue-400 transition">${g.nama}</h3>
            <p class="text-xs text-slate-400 mt-1.5 truncate">${g.genre}</p>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderGames);
    fetchCatalog();
  </script>
</body>
</html>
